{% extends 'base.html' %}

{% block contenido %}

<h1>Dashboard</h1>

<div class="row mt-4">

    <div class="col-md-3">

        <div class="card card-dashboard">

            <div class="card-body">

                <h5>Productos</h5>

                <a href="/productos"
                   class="btn btn-primary">
                   Ver
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card card-dashboard">

            <div class="card-body">

                <h5>Proveedores</h5>

                <a href="/proveedores"
                   class="btn btn-success">
                   Ver
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card card-dashboard">

            <div class="card-body">

                <h5>Compras</h5>

                <a href="/compras"
                   class="btn btn-info">
                   Ver
                </a>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card card-dashboard">

            <div class="card-body">

                <h5>Ventas</h5>

                <a href="/ventas"
                   class="btn btn-danger">
                   Ver
                </a>

            </div>

        </div>

    </div>

</div>

<hr class="my-5">

<div class="row">

    <div class="col-md-6 mb-4">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">
                    📈 Ventas últimos 30 días
                </h5>

            </div>

            <div class="card-body" style="height:350px;">

              <canvas id="ventasDiariasChart"></canvas>

            </div>

        </div>

    </div>

    <div class="col-md-6 mb-4">

        <div class="card shadow-sm">

            <div class="card-header bg-success text-white">

                <h5 class="mb-0">
                    📊 Ventas últimos 12 meses
                </h5>

            </div>

            <div class="card-body" style="height:350px;">

                 <canvas id="ventasMensualesChart"></canvas>

            </div>

        </div>

    </div>

</div>

{% endblock %}
<script>

fetch("/api/ventas-diarias")
    .then(response => response.json())
    .then(datos => {

        const etiquetas = datos.map(item => {

            const fecha = new Date(item.fecha);

            return fecha.toLocaleDateString('es-ES', {
                day: '2-digit',
                month: '2-digit'
            });

        });

        const ventas = datos.map(item => item.total);

        const ctx = document
            .getElementById('ventasDiariasChart')
            .getContext('2d');

        new Chart(ctx, {

            type: 'line',

            data: {

                labels: etiquetas,

                datasets: [{

                    label: 'Ventas ($)',

                    data: ventas,

                    borderColor: '#0d6efd',

                    backgroundColor: 'rgba(13,110,253,0.15)',

                    fill: true,

                    tension: 0.3,

                    pointRadius: 4,

                    pointHoverRadius: 6

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        display: true

                    }

                },

                scales: {

                    y: {

                        beginAtZero: true

                    }

                }

            }

        });

    });

</script>
